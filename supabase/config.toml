# Configuração do Supabase CLI (desenvolvimento local: `npx supabase start`).
# Em produção, rode `npx supabase link --project-ref <ref>` e `npx supabase db push`.
project_id = "nishiads"

[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/redefinir-senha"]
# Uso próprio: contas são criadas pelo admin (Dashboard › Authentication › Users).
enable_signup = false
minimum_password_length = 8

[auth.email]
enable_confirmations = true
double_confirm_changes = true

# Provedores de checkout não mandam JWT do Supabase: a função valida a assinatura de cada um.
[functions.webhooks]
verify_jwt = false

# Valida o token do usuário dentro da função (funciona com as chaves novas do Supabase).
[functions.push]
verify_jwt = false

# Retorno do Facebook Login não traz JWT; o início (POST) valida o token do usuário na função.
[functions.meta-oauth]
verify_jwt = false

# Chamada pelo pg_cron (header x-cron-secret) e pelo app (token do usuário, validado na função).
[functions.meta-sync]
verify_jwt = false
